<div id="hud">

      <b>PC</b> : マウス移動(前手) ／ ホイール(角度) ／ 左クリック・Space(寸勁) ／ 右クリック・Q/E(スリップ)

<script type="module">
import * as THREE from 'three';

// =========================================================================
// 1. クリーン音響エンジン（常時ノイズ完全廃止・透明なクリスタル＆重低音のみ）
// =========================================================================
class CleanSoundEngine {
  constructor() {
    this.ctx = null;
    // 透明感のあるクリスタルペンタトニック (D4, F4, G4, A4, C5, D5, F5, G5, A5, C6, D6)
    this.scale = [293.66, 349.23, 392.00, 440.00, 523.25, 587.33, 698.46, 783.99, 880.00, 1046.50, 1174.66];
  }
  init() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.65;
      this.master.connect(this.ctx.destination);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  }
  // 刀の鍔鳴り・クリスタルパリィ音（澄んだFMベル）
  parry(isJust = false) {
    this.init();
    const t = this.ctx.currentTime;
    const base = isJust ? 1174.66 : 880.0;
    [base, base * 1.498, base * 2.0].forEach((f, i) => {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(f, t);
      o.frequency.exponentialRampToValueAtTime(f * 0.96, t + 0.18);
      g.gain.setValueAtTime((isJust ? 0.28 : 0.18) / (i + 1), t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (isJust ? 0.25 : 0.16));
      o.connect(g); g.connect(this.master);
      o.start(t); o.stop(t + 0.26);
    });
  }
  // 寸勁インパクト（キレのあるタイトなサブベース＋高域アタック）
  sunkei(isCrit = true) {
    this.init();
    const t = this.ctx.currentTime;
    const sub = this.ctx.createOscillator(), sg = this.ctx.createGain();
    sub.type = 'sine';
    sub.frequency.setValueAtTime(isCrit ? 160 : 120, t);
    sub.frequency.exponentialRampToValueAtTime(28, t + 0.22);
    sg.gain.setValueAtTime(isCrit ? 0.9 : 0.55, t);
    sg.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
    sub.connect(sg); sg.connect(this.master);
    sub.start(t); sub.stop(t + 0.25);

    if (isCrit) {
      const hi = this.ctx.createOscillator(), hg = this.ctx.createGain();
      hi.type = 'triangle';
      hi.frequency.setValueAtTime(1760, t);
      hi.frequency.exponentialRampToValueAtTime(587.33, t + 0.12);
      hg.gain.setValueAtTime(0.25, t);
      hg.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
      hi.connect(hg); hg.connect(this.master);
      hi.start(t); hi.stop(t + 0.14);
    }
  }
  // 首スリップ（シュッという風切り＋鼓動）
  slip() {
    this.init();
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(520, t);
    o.frequency.exponentialRampToValueAtTime(90, t + 0.22);
    g.gain.setValueAtTime(0.4, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + 0.25);
  }
  // 居着き・角度ミス時の短いクリック音（不快なブザー音を廃止）
  guardBreak() {
    this.init();
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(190, t);
    o.frequency.linearRampToValueAtTime(75, t + 0.09);
    g.gain.setValueAtTime(0.35, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + 0.11);
  }
  // ビリヤード連鎖の透明な和音チャイム
  chain(idx) {
    this.init();
    const t = this.ctx.currentTime;
    const f = this.scale[Math.min(idx, this.scale.length - 1)];
    [f, f * 1.5].forEach((freq, i) => {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(i === 0 ? 0.3 : 0.12, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
      o.connect(g); g.connect(this.master);
      o.start(t); o.stop(t + 0.36);
    });
  }
}
const sfx = new CleanSoundEngine();

// =========================================================================
// 2. Three.js シャープ＆ハイコントラスト空間構築
// =========================================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020306);
scene.fog = new THREE.FogExp2(0x020306, 0.032);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 80);
camera.position.set(0, 1.6, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);

// VR起動制御
const vrBtn = document.getElementById('vr-btn');
let activeSession = null;
vrBtn.addEventListener('click', async () => {
  sfx.init();
  if (!navigator.xr) return;
  try {
    if (!activeSession) {
      const session = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor', 'bounded-floor'] });
      renderer.xr.setReferenceSpaceType('local-floor');
      await renderer.xr.setSession(session);
      activeSession = session;
      vrBtn.style.display = 'none';
      session.addEventListener('end', () => { activeSession = null; vrBtn.style.display = 'inline-block'; });
    }
  } catch (e) { popJudge('HTTPS REQUIRED FOR VR', '#ff2a6d'); }
});

scene.add(new THREE.AmbientLight(0xd0e8ff, 0.9));
const dLight = new THREE.DirectionalLight(0xffffff, 1.8);
dLight.position.set(2, 10, 4);
scene.add(dLight);

// ミニマルな極細フロアライン
const grid = new THREE.PolarGridHelper(16, 12, 8, 64, 0x0a2e46, 0x061524);
grid.position.y = 0.01;
scene.add(grid);

// 射出方向ロックオン・レーザー予測線（パリィ成立時の0.45秒間だけ走る）
const laserGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, -10)]);
const laserMat = new THREE.LineBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: 0 });
const laserLine = new THREE.Line(laserGeo, laserMat);
scene.add(laserLine);

// VR内でも邪魔にならないミニマル空間ポップアップ文字（邪魔な枠・背景なし）
const vrTextCv = document.createElement('canvas');
vrTextCv.width = 512; vrTextCv.height = 128;
const vrTextCtx = vrTextCv.getContext('2d');
const vrTextTex = new THREE.CanvasTexture(vrTextCv);
const vrTextMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(1.4, 0.35),
  new THREE.MeshBasicMaterial({ map: vrTextTex, transparent: true, depthWrite: false })
);
vrTextMesh.position.set(0, 2.05, -2.4);
scene.add(vrTextMesh);

// =========================================================================
// 3. シャープなブレード型ハンド＆HMDトラッカー
// =========================================================================
function createBladeHand(colHex, xOffset) {
  const g = new THREE.Group();
  // もっさりした丸円盤を廃止し、シャープな菱形エネルギーブレードに変更
  const bladeGeo = new THREE.OctahedronGeometry(0.11, 0);
  bladeGeo.scale(1.1, 0.14, 1.4);
  const mat = new THREE.MeshStandardMaterial({
    color: colHex, emissive: colHex, emissiveIntensity: 0.7, flatShading: true
  });
  const mesh = new THREE.Mesh(bladeGeo, mat);
  const wire = new THREE.Mesh(bladeGeo, new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.5 }));
  g.add(mesh, wire);
  scene.add(g);

  return {
    mesh: g, pos: new THREE.Vector3(xOffset, 1.35, -0.5), prevPos: new THREE.Vector3(xOffset, 1.35, -0.5),
    vel: new THREE.Vector3(), speed: 0, prevSpeed: 0, normal: new THREE.Vector3(0, 0, -1),
    strokeStart: new THREE.Vector3(), moving: false, peakAccel: 0, strokeDist: 0, ctrl: null,
    haptic(v, ms) { try { this.ctrl?.gamepad?.hapticActuators?.[0]?.pulse(v, ms); } catch (e) {} }
  };
}
const handL = createBladeHand(0x00f0ff, -0.22);
const handR = createBladeHand(0xffd000, 0.22);

const c0 = renderer.xr.getController(0), c1 = renderer.xr.getController(1);
scene.add(c0, c1);
c0.addEventListener('connected', e => handL.ctrl = e.data);
c1.addEventListener('connected', e => handR.ctrl = e.data);
c0.addEventListener('selectstart', () => { sfx.init(); if (state.over || state.win) resetGame(); });
c1.addEventListener('selectstart', () => { sfx.init(); if (state.over || state.win) resetGame(); });

const hmd = { pos: new THREE.Vector3(0, 1.6, 0), prevQ: new THREE.Quaternion(), angVel: 0, cd: 0 };
const pc = { mx: 0, my: 0, deg: 45, punchT: 0, stroke: 0.09, parrySnapT: 0 };

addEventListener('mousemove', e => {
  pc.mx = (e.clientX / innerWidth) * 2 - 1;
  pc.my = -(e.clientY / innerHeight) * 2 + 1;
  pc.parrySnapT = 0.15; // マウスを動かした瞬間はジャストパリィ受付
});
addEventListener('wheel', e => {
  pc.deg = THREE.MathUtils.clamp(pc.deg + (e.deltaY > 0 ? -5 : 5), 10, 80);
  popJudge(`ANGLE ${pc.deg}°`, pc.deg >= 25 && pc.deg <= 68 ? '#00f0ff' : '#ff2a6d');
});
addEventListener('mousedown', e => {
  if (e.target.tagName === 'BUTTON') return;
  sfx.init();
  if (e.button === 0) {
    if (state.over || state.win) resetGame();
    else { pc.punchT = 0.14; pc.stroke = e.shiftKey ? 0.38 : 0.08; }
  }
  if (e.button === 2) hmd.angVel = 4.5;
});
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  if (e.code === 'Space') { sfx.init(); pc.punchT = 0.14; pc.stroke = e.shiftKey ? 0.38 : 0.08; }
  if (e.code === 'KeyQ' || e.code === 'KeyE') { sfx.init(); hmd.angVel = 4.5; }
});

// =========================================================================
// 4. 全5ウェーブ定義（連撃リズム＆ビリヤード配置）
// =========================================================================
const WAVES = [
  { t: 'WAVE 01 // 聴勁と二拍子', s: '前手で弾き（タッ！）、0.45秒の収縮リングに合わせて寸勁を叩き込め（タン！）', iv: 2.8, kills: 7,
    pat: i => i % 2 ? [{ type: 'Spear', a: 0, d: 10, v: 9.0, w: 0 }, { type: 'Spear', a: 3, d: 12.5, v: 9.0, w: 0.12 }] : [{ type: 'Spear', a: i % 4 ? 20 : -20, d: 10, v: 8.8, w: 0 }] },
  { t: 'WAVE 02 // レーザー誘導ビリヤード', s: 'パリィで走るレーザー予測線を後続の敵群へ重ね、一撃で貫通連鎖させよ', iv: 3.0, kills: 12,
    pat: i => i % 2 === 0 ? [{ type: 'Hammer', a: 0, d: 10.5, v: 10.0, w: 0 }, { type: 'Spear', a: 28, d: 8.5, v: 5.0, w: 0 }, { type: 'Spear', a: 34, d: 9.2, v: 5.0, w: 0.1 }] : [{ type: 'Spear', a: -24, d: 10, v: 9.5, w: 0 }, { type: 'Spear', a: 24, d: 10, v: 9.5, w: 0.28 }] },
  { t: 'WAVE 03 // 後の先・スリッピング', s: '顔面へ迫る赤き閃光(Viper)を首の回旋でかわし、耳元を通過する刹那に撃ち抜け', iv: 2.9, kills: 12,
    pat: i => [{ type: 'Hammer', a: -20, d: 10, v: 9.5, w: 0 }, { type: 'Viper', a: 5, d: 11.5, v: 16.0, w: 0.32 }] },
  { t: 'WAVE 04 // タ・タ・ドン！連続パリィ', s: '時間差で飛来する連撃をリズミカルに弾き、束ねた敵群を一気に粉砕せよ', iv: 3.4, kills: 16,
    pat: i => { const dir = i % 2 ? 1 : -1; return [{ type: 'Spear', a: -35 * dir, d: 10.5, v: 10.5, w: 0 }, { type: 'Hammer', a: -10 * dir, d: 10.5, v: 10.5, w: 0.25 }, { type: 'Spear', a: 18 * dir, d: 10.5, v: 10.5, w: 0.5 }, { type: 'Viper', a: 4 * dir, d: 12, v: 16.5, w: 0.85 }]; } },
  { t: 'FINAL WAVE // 極限化勁・百花繚乱', s: '全方位スパイラル連撃を捌き切り、最後に迫る黄金の【BOSS CORE】を撃ち抜け！', iv: 3.8, kills: 20,
    pat: i => i === 0 ? [{ type: 'Spear', a: -50, d: 11, v: 11, w: 0 }, { type: 'Hammer', a: -22, d: 11, v: 11, w: 0.22 }, { type: 'Spear', a: 0, d: 11, v: 11, w: 0.44 }, { type: 'Hammer', a: 25, d: 11, v: 11, w: 0.66 }] : [{ type: 'Viper', a: -8, d: 12, v: 17, w: 0 }, { type: 'Boss', a: 0, d: 13, v: 10.5, w: 0.22 }, { type: 'Spear', a: -30, d: 11.5, v: 9, w: 0.35 }, { type: 'Spear', a: 30, d: 11.5, v: 9, w: 0.35 }] }
];

const enemies = [], parts = [], rings = [];
const state = { wIdx: 0, spTimer: 0.8, batch: 0, kills: 0, queue: [], scale: 1, dilT: 0, hitStop: 0, score: 0, chain: 0, hp: 3, over: false, win: false };

function spawnEnemy({ type, a, d, v }) {
  const cfg = {
    Spear:  { geo: new THREE.ConeGeometry(0.22, 0.85, 4).rotateX(Math.PI / 2), col: 0x00f0ff, r: 0.36 },
    Hammer: { geo: new THREE.OctahedronGeometry(0.42, 0), col: 0xff7700, r: 0.48 },
    Viper:  { geo: new THREE.ConeGeometry(0.14, 1.05, 3).rotateX(Math.PI / 2), col: 0xff0055, r: 0.34 },
    Boss:   { geo: new THREE.IcosahedronGeometry(0.82, 0), col: 0xffd000, r: 0.88 }
  }[type];

  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: cfg.col, emissive: cfg.col, emissiveIntensity: 0.65, flatShading: true });
  const mesh = new THREE.Mesh(cfg.geo, mat);
  const wire = new THREE.Mesh(cfg.geo, new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.45 }));

  // 0.45秒でキュッと収縮するタイミングリング（パリィ時に出現）
  const ringMat = new THREE.MeshBasicMaterial({ color: 0xffea00, side: THREE.DoubleSide, transparent: true, opacity: 0 });
  const ring = new THREE.Mesh(new THREE.RingGeometry(cfg.r * 0.45, cfg.r * 0.58, 24), ringMat);
  g.add(mesh, wire, ring);

  const rad = THREE.MathUtils.degToRad(a), y = type === 'Viper' ? 1.58 : 1.38;
  g.position.set(Math.sin(rad) * d, y, -Math.cos(rad) * d);
  const target = new THREE.Vector3(0, y, 0);
  g.lookAt(target);
  scene.add(g);

  enemies.push({
    type, group: g, mesh, mat, ring, ringMat, r: cfg.r, col: cfg.col,
    pos: g.position, vel: target.sub(g.position).normalize().multiplyScalar(v),
    inSpeed: v, st: 'IN', eff: 1, timer: 0, maxTimer: 0.45
  });
}

function addSpark(pos, col, n = 16, speed = 11) {
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(new THREE.TetrahedronGeometry(0.055, 0), new THREE.MeshBasicMaterial({ color: col, transparent: true }));
    m.position.copy(pos); scene.add(m);
    parts.push({ m, v: new THREE.Vector3((Math.random() - 0.5) * speed, (Math.random() - 0.3) * speed, (Math.random() - 0.5) * speed), life: 0.38 });
  }
}

function addPulseRing(pos, lookDir, col = 0x00f0ff, maxSc = 3.2) {
  const mat = new THREE.MeshBasicMaterial({ color: col, side: THREE.DoubleSide, transparent: true, opacity: 0.9 });
  const m = new THREE.Mesh(new THREE.RingGeometry(0.12, 0.18, 24), mat);
  m.position.copy(pos);
  m.lookAt(pos.clone().add(lookDir));
  scene.add(m);
  rings.push({ m, mat, spd: maxSc * 6.5, life: 0.25 });
}

function popJudge(txt, col = '#00f0ff') {
  const el = document.getElementById('judge');
  el.textContent = txt; el.style.color = col;
  el.style.transform = 'scale(1.12)';
  setTimeout(() => el.style.transform = 'scale(1)', 80);

  vrTextCtx.clearRect(0, 0, 512, 128);
  vrTextCtx.fillStyle = col;
  vrTextCtx.font = '900 36px sans-serif';
  vrTextCtx.textAlign = 'center';
  vrTextCtx.fillText(txt, 256, 64);
  vrTextCtx.fillStyle = 'rgba(255,255,255,0.7)';
  vrTextCtx.font = '600 20px sans-serif';
  vrTextCtx.fillText(`WAVE ${state.wIdx + 1}   SCORE ${state.score}   CHAIN ${state.chain}`, 256, 106);
  vrTextTex.needsUpdate = true;
}

function syncUI() {
  document.getElementById('ui-wave').textContent = `0${state.wIdx + 1}`;
  document.getElementById('ui-score').textContent = String(state.score).padStart(4, '0');
  document.getElementById('ui-chain').textContent = state.chain;
  document.getElementById('ui-hp').textContent = '/'.repeat(Math.max(0, state.hp));
  document.getElementById('flash').style.boxShadow =
    state.scale <= 0.22 ? 'inset 0 0 80px rgba(255,0,85,0.45)' :
    state.scale <= 0.50 ? 'inset 0 0 60px rgba(0,240,255,0.35)' : 'none';
}

function setWave(idx) {
  state.wIdx = THREE.MathUtils.clamp(idx, 0, WAVES.length - 1);
  state.spTimer = 0.8; state.batch = 0; state.kills = 0; state.queue = [];
  document.getElementById('w-title').textContent = WAVES[state.wIdx].t;
  document.getElementById('w-sub').textContent = WAVES[state.wIdx].s;
  popJudge(`WAVE 0${state.wIdx + 1}`, '#00f0ff'); syncUI();
}

function resetGame() {
  enemies.forEach(e => scene.remove(e.group)); enemies.length = 0;
  Object.assign(state, { score: 0, chain: 0, hp: 3, scale: 1, dilT: 0, hitStop: 0, over: false, win: false });
  setWave(0);
}

document.getElementById('btn-skip').onclick = () => { sfx.init(); enemies.forEach(e => scene.remove(e.group)); enemies.length = 0; setWave((state.wIdx + 1) % WAVES.length); };
document.getElementById('btn-retry').onclick = () => { sfx.init(); resetGame(); };

// =========================================================================
// 5. メインループ（0.45秒の高速二拍子パリィ＆レーザーロックオン）
// =========================================================================
const clock = new THREE.Clock();

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);

  // ヒットストップ（ジャストパリィ時の0.05秒凍結 ＆ ボス撃破時の0.5秒凍結）
  if (state.hitStop > 0) {
    state.hitStop -= dt;
    if (state.hitStop <= 0 && state.win) {
      enemies.forEach(e => { addSpark(e.pos, 0xffd000, 22, 16); scene.remove(e.group); }); enemies.length = 0;
      sfx.chain(9); state.score += 5000;
      document.getElementById('w-title').textContent = 'MASTER OF KAKEI // COMPLETE';
      popJudge('ALL WAVES CLEARED', '#ffd000'); syncUI();
    }
    renderer.render(scene, camera); return;
  }

  // HMD＆コントローラー更新
  const xrCam = renderer.xr.isPresenting ? renderer.xr.getCamera() : camera;
  xrCam.getWorldPosition(hmd.pos);
  const q = new THREE.Quaternion(); xrCam.getWorldQuaternion(q);
  const ang = 2 * Math.acos(Math.min(1, Math.abs(q.dot(hmd.prevQ))));
  hmd.angVel = Math.max(dt > 0 ? ang / dt : 0, hmd.angVel * 0.82);
  hmd.prevQ.copy(q);
  if (hmd.cd > 0) hmd.cd -= dt;

  if (renderer.xr.isPresenting) {
    c0.getWorldPosition(handL.pos); c0.getWorldQuaternion(handL.mesh.quaternion);
    handL.normal.set(0, 0, -1).applyQuaternion(handL.mesh.quaternion).normalize();
    c1.getWorldPosition(handR.pos); c1.getWorldQuaternion(handR.mesh.quaternion);
    handR.normal.set(0, 0, -1).applyQuaternion(handR.mesh.quaternion).normalize();
  } else {
    const tx = pc.mx * 0.85, ty = THREE.MathUtils.clamp(1.35 + pc.my * 0.45, 0.9, 1.85);
    handL.pos.lerp(new THREE.Vector3(tx, ty, -0.62), 0.45);
    const rad = THREE.MathUtils.degToRad(pc.deg);
    handL.mesh.rotation.set(0, -rad, 0);
    handL.normal.set(Math.sin(rad), 0, -Math.cos(rad)).normalize();
    if (pc.parrySnapT > 0) pc.parrySnapT -= dt;

    if (pc.punchT > 0) {
      pc.punchT -= dt; handR.pos.lerp(new THREE.Vector3(tx, ty, -0.68), 0.72);
      handR.strokeDist = pc.stroke; handR.peakAccel = pc.stroke <= 0.16 ? 42 : 18;
    } else handR.pos.lerp(new THREE.Vector3(tx + 0.16, ty - 0.08, -0.32), 0.3);
    handR.normal.set(pc.mx * 0.35, pc.my * 0.15, -1).normalize();
  }

  [handL, handR].forEach(h => {
    if (dt <= 0) return;
    h.vel.subVectors(h.pos, h.prevPos).divideScalar(dt);
    h.speed = h.vel.length();
    const acc = (h.speed - h.prevSpeed) / dt;
    if (h.speed > 0.95 && h.vel.z < -0.3) {
      if (!h.moving) { h.moving = true; h.strokeStart.copy(h.prevPos); h.peakAccel = Math.max(10, acc); }
      else h.peakAccel = Math.max(h.peakAccel, acc);
      h.strokeDist = h.pos.distanceTo(h.strokeStart);
    } else if (h.speed < 0.45) { h.moving = false; h.peakAccel = 0; h.strokeDist = 0; }
    h.prevPos.copy(h.pos); h.prevSpeed = h.speed; h.mesh.position.copy(h.pos);
  });

  const front = Math.abs(handL.pos.z - hmd.pos.z) >= Math.abs(handR.pos.z - hmd.pos.z) - 0.05 ? handL : handR;
  const rear = front === handL ? handR : handL;

  if (state.dilT > 0 && (state.dilT -= dt) <= 0) { state.scale = 1.0; syncUI(); }
  const sdt = dt * state.scale;

  // スポーン進行
  if (!state.over && !state.win) {
    const w = WAVES[state.wIdx];
    if ((state.spTimer -= sdt) <= 0) {
      w.pat(state.batch++).forEach(p => state.queue.push({ ...p, t: p.w }));
      state.spTimer = w.iv;
    }
    for (let i = state.queue.length - 1; i >= 0; i--) {
      if ((state.queue[i].t -= sdt) <= 0) { spawnEnemy(state.queue[i]); state.queue.splice(i, 1); }
    }
    if (state.kills >= w.kills && enemies.length === 0 && state.queue.length === 0) {
      if (state.wIdx < WAVES.length - 1) { sfx.chain(5); setWave(state.wIdx + 1); }
      else { state.win = true; popJudge('ALL WAVES CLEARED', '#ffd000'); }
    }
  }

  laserMat.opacity = 0;

  // 敵挙動＆パリィ判定
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];

    if (e.st === 'IN') {
      e.pos.addScaledVector(e.vel, sdt);
      e.mesh.rotation.z += 3.2 * sdt;

      // 1) 前手「高速パリィ（0.45秒の軌道偏向窓）」
      if (e.pos.distanceTo(front.pos) < e.r + 0.28 && e.type !== 'Viper') {
        const deg = THREE.MathUtils.radToDeg(Math.acos(THREE.MathUtils.clamp(e.vel.clone().normalize().negate().dot(front.normal), -1, 1)));
        if (deg >= 20 && deg <= 70) {
          // 引きつけ距離または前手のスナップ速度で「JUST PARRY」判定
          const isJust = (front.speed > 0.45 || pc.parrySnapT > 0) && Math.abs(e.pos.z) < 0.95;
          e.st = 'PARRIED';
          e.maxTimer = 0.48; // 1.8秒のダラダラ吸着を廃止し、0.48秒のキレのある二拍子窓へ！
          e.timer = e.maxTimer;
          e.eff = isJust ? 1.45 : 1.0;
          e.ringMat.opacity = 1.0;

          // ベタ付き停止せず、前手法線方向（脇）へ軌道偏向して滑り抜ける
          const deflectDir = e.vel.clone().normalize().addScaledVector(front.normal, 0.85).normalize();
          e.vel.copy(deflectDir).multiplyScalar(e.inSpeed * 0.35);

          state.scale = 0.38;
          state.dilT = 0.48;
          if (isJust) state.hitStop = 0.045; // 心地よい瞬間ヒットストップ

          sfx.parry(isJust);
          front.haptic(isJust ? 0.85 : 0.45, isJust ? 55 : 35);
          addSpark(e.pos, isJust ? 0xffea00 : 0x00f0ff, isJust ? 18 : 10, 9);
          addPulseRing(e.pos, front.normal, isJust ? 0xffea00 : 0x00f0ff, 2.2);
          popJudge(isJust ? 'JUST PARRY // 極・聴勁!' : 'PARRY // 化勁', isJust ? '#ffea00' : '#00f0ff');
          syncUI();
        } else {
          sfx.guardBreak(); front.haptic(0.8, 80);
          popJudge(`BAD ANGLE (${deg.toFixed(0)}°)`, '#ff2a6d');
          e.vel.multiplyScalar(0.6);
        }
      }

      // 2) 首「スリッピング」：ワープ固定を廃止し、耳元をスローでかすめ飛ぶ自然な軌道へ
      const dHead = e.pos.distanceTo(hmd.pos);
      if (dHead < 1.25 && dHead > 0.22 && hmd.angVel > 1.3 && hmd.cd <= 0) {
        e.st = 'PARRIED';
        e.maxTimer = 0.65;
        e.timer = e.maxTimer;
        e.eff = 1.5;
        e.ringMat.opacity = 1.0;
        // 顔のすぐ横（耳元）へ軌道を逸らしてスロー通過させる
        const side = e.pos.x >= 0 ? 0.35 : -0.35;
        e.vel.set(side * 1.5, 0, 2.2);
        hmd.cd = 0.75;
        state.scale = 0.18;
        state.dilT = 0.65;
        if (state.hp < 3) state.hp++;
        sfx.slip();
        addPulseRing(e.pos, e.vel, 0xff0055, 2.5);
        popJudge('SLIP // 見切り反撃! (+1 LIFE)', '#ff0055');
        syncUI();
      }

      // 3) 被弾判定
      if (e.pos.z > -0.15) {
        addSpark(e.pos, 0xff0055, 16, 10); sfx.guardBreak();
        scene.remove(e.group); enemies.splice(i, 1);
        state.hp--; state.chain = 0; popJudge('HIT // 被弾', '#ff0055');
        if (state.hp <= 0) { state.over = true; document.getElementById('w-title').textContent = 'GAME OVER // 居着き敗北'; }
        syncUI(); continue;
      }

    } else if (e.st === 'PARRIED') {
      // パリィ後の0.48秒間：脇へゆっくり滑りながら、タイミングリングが中心へキュッと収縮する
      e.timer -= dt;
      e.pos.addScaledVector(e.vel, dt * 0.45);
      const shrink = Math.max(0.25, (e.timer / e.maxTimer) * 2.2);
      e.ring.scale.set(shrink, shrink, 1);
      e.ring.lookAt(hmd.pos);

      // 射出方向ロックオン・レーザー予測線を表示
      const aimDir = rear.normal.clone(); aimDir.z = Math.min(-0.5, aimDir.z); aimDir.normalize();
      enemies.forEach(o => {
        if (o !== e && o.st !== 'OUT') {
          const to = o.pos.clone().sub(e.pos).normalize();
          if (aimDir.dot(to) > 0.72) aimDir.lerp(to, 0.75).normalize();
        }
      });
      const pts = laserLine.geometry.attributes.position;
      pts.setXYZ(0, e.pos.x, e.pos.y, e.pos.z);
      pts.setXYZ(1, e.pos.x + aimDir.x * 12, e.pos.y + aimDir.y * 12, e.pos.z + aimDir.z * 12);
      pts.needsUpdate = true;
      laserMat.opacity = 0.75;

      // 後手「発（寸勁）」インパクト判定
      if (e.pos.distanceTo(rear.pos) < e.r + 0.38 && (rear.speed > 1.05 || pc.punchT > 0)) {
        const sDist = Math.max(0.05, rear.strokeDist || 0.08);
        if (sDist > 0.28) {
          sfx.guardBreak(); rear.haptic(0.8, 100);
          popJudge(`OVER-SWING 大振り減衰 (${(sDist * 100).toFixed(0)}cm)`, '#ff2a6d');
          e.vel.multiplyScalar(-0.4); e.st = 'IN'; continue;
        }
        const crit = sDist <= 0.15;
        const pen = Math.exp(-Math.max(0, sDist - 0.15) / 0.12);
        const launchSpd = ((rear.peakAccel || 35) * 0.5 * pen + e.inSpeed * e.eff) * (crit ? 1.25 : 1.0);

        e.vel.copy(aimDir).multiplyScalar(Math.max(22, launchSpd));
        e.st = 'OUT'; e.ringMat.opacity = 0;
        e.mat.color.setHex(0xffea00); e.mat.emissive.setHex(0xffea00);

        if (e.type === 'Boss') {
          state.win = true; state.hitStop = 0.55;
          sfx.sunkei(true); rear.haptic(1, 350); front.haptic(1, 350);
          addPulseRing(e.pos, aimDir, 0xffd000, 7.0); addSpark(e.pos, 0xffd000, 40, 18);
          popJudge('極限浸透勁 // BOSS CORE SHATTERED!', '#ffd000'); continue;
        }

        sfx.sunkei(crit); rear.haptic(crit ? 1.0 : 0.65, 85);
        addPulseRing(e.pos, aimDir, crit ? 0xffea00 : 0x00f0ff, crit ? 3.6 : 2.2);
        addSpark(e.pos, crit ? 0xffea00 : 0x00f0ff, 14, 12);
        state.scale = 1.0; state.dilT = 0; state.score += crit ? 350 : 180;
        popJudge(crit ? `極・寸勁 SUNKEI! (${(sDist * 100).toFixed(0)}cm)` : 'COUNTER!', crit ? '#ffea00' : '#00f0ff');
        syncUI();

      } else if (e.timer <= 0) {
        // 0.48秒以内に打たなかった場合は脇をすり抜けて消滅（ダラダラ残らない）
        scene.remove(e.group); enemies.splice(i, 1); state.kills++;
      }

    } else if (e.st === 'OUT') {
      // 高速射出＆ビリヤード連鎖
      e.pos.addScaledVector(e.vel, dt);
      e.mesh.rotation.x += 15 * dt; e.mesh.rotation.y += 15 * dt;

      for (let j = enemies.length - 1; j >= 0; j--) {
        if (i === j || enemies[j].st === 'OUT') continue;
        if (e.pos.distanceTo(enemies[j].pos) < e.r + enemies[j].r + 0.42) {
          state.chain++; state.kills++; state.score += 300 * state.chain;
          sfx.chain(state.chain);
          addSpark(enemies[j].pos, enemies[j].col, 20, 14);
          addPulseRing(enemies[j].pos, e.vel, 0x00ffcc, 2.8);
          popJudge(`CHAIN x${state.chain} // 連消帯打!`, '#00ffcc');
          scene.remove(enemies[j].group); enemies.splice(j, 1);
          if (j < i) i--;
          syncUI();
        }
      }
      if (e.pos.length() > 24) { scene.remove(e.group); enemies.splice(i, 1); state.kills++; }
    }
  }

  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt; p.m.position.addScaledVector(p.v, dt); p.m.material.opacity = p.life * 2.5;
    if (p.life <= 0) { scene.remove(p.m); parts.splice(i, 1); }
  }
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i]; r.life -= dt;
    const sc = 1 + (0.25 - r.life) * r.spd; r.m.scale.set(sc, sc, 1); r.mat.opacity = r.life * 3.5;
    if (r.life <= 0) { scene.remove(r.m); rings.splice(i, 1); }
  }

  renderer.render(scene, camera);
});

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
setWave(0);
</script>
</body>
</html>
